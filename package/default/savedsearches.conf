[AI Governance - New AI User Seen]
search = `aigov_audit` aigov_user=* | stats earliest(_time) as first_seen by aigov_user aigov_provider | where first_seen >= relative_time(now(), "-1d@d") | convert ctime(first_seen)
description = A user was observed interacting with a monitored AI platform for the first time in the last day.
disabled = 1
enableSched = 1
cron_schedule = 0 6 * * *
dispatch.earliest_time = -30d@d
dispatch.latest_time = now
alert.suppress = 0
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than

[AI Governance - Off-Hours Activity Spike]
search = `aigov_audit` date_hour>=0 date_hour<6 | bin _time span=1h | stats count by _time aigov_provider | where count > 100
description = Unusually high AI platform activity between midnight and 6 AM (tune threshold and hours for your timezone).
disabled = 1
enableSched = 1
cron_schedule = 0 7 * * *
dispatch.earliest_time = -24h
dispatch.latest_time = now
alert.suppress = 0
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than

[AI Governance - Daily Spend Threshold Exceeded]
search = `aigov_cost` | eval cost=coalesce('amount.value', cost, amount) | bin _time span=1d | stats sum(cost) as daily_cost by _time aigov_provider | where daily_cost > 1000
description = Daily AI platform spend exceeded the configured threshold (default 1000; adjust to your budget).
disabled = 1
enableSched = 1
cron_schedule = 0 8 * * *
dispatch.earliest_time = -2d@d
dispatch.latest_time = now
alert.suppress = 0
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than

[AI Governance - New Self-Hosted Model Detected]
search = `aigov_index` sourcetype="aigov:selfhosted:audit" aigov_action IN ("model_added","model_removed") | table _time aigov_action model_id server_type source | sort - _time
description = A model was added to or removed from a monitored self-hosted LLM server. Review whether the model is approved for use.
disabled = 1
enableSched = 1
cron_schedule = */30 * * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
alert.suppress = 0
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than

[AI Governance - Self-Hosted Server Down]
search = `aigov_index` sourcetype="aigov:selfhosted:health" status="down" | table _time base_url server_type error | sort - _time
description = A monitored self-hosted LLM server failed its health check.
disabled = 1
enableSched = 1
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m
dispatch.latest_time = now
alert.suppress = 0
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than
