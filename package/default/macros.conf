# Search macros for AI Governance dashboards and alerts.
# Adjust aigov_index to the index (or indexes) your inputs write to.

[aigov_index]
definition = index=*
iseval = 0

[aigov_all]
definition = `aigov_index` (sourcetype=aigov:* OR sourcetype=anthropic:compliance:* OR sourcetype=anthropic:analytics:*)
iseval = 0

[aigov_audit]
definition = `aigov_index` sourcetype IN ("anthropic:compliance:activity","aigov:openai:audit","aigov:gemini:audit","aigov:copilot:interaction","aigov:selfhosted:audit")
iseval = 0

[aigov_directory]
definition = `aigov_index` sourcetype IN ("anthropic:compliance:user","anthropic:compliance:group","anthropic:compliance:organization","aigov:openai:user")
iseval = 0

[aigov_usage]
definition = `aigov_index` sourcetype IN ("anthropic:analytics:usage","anthropic:analytics:user_usage","anthropic:analytics:user_activity","aigov:openai:usage","aigov:copilot:usage")
iseval = 0

[aigov_cost]
definition = `aigov_index` sourcetype IN ("anthropic:analytics:cost","anthropic:analytics:user_cost","aigov:openai:cost")
iseval = 0

[aigov_signin_actions]
definition = aigov_action IN ("user_signed_in_sso","user_signed_in_google","user_signed_in_apple","user_signed_in_magic_link","user_signed_in_phone_code","login.succeeded","login.failed","user.login.succeeded","user.login.failed","LOGIN")
iseval = 0

[aigov_admin_actions]
definition = aigov_action IN ("org_sso_toggled","org_sso_add_initiated","org_sso_connection_activated","org_sso_connection_deactivated","org_sso_connection_deleted","org_jit_toggled","org_domain_add_initiated","org_domain_verified","org_user_deleted","organization.updated","user.updated","role.updated","invite.sent","invite.accepted","invite.deleted","user.added","user.deleted","service_account.created","service_account.deleted","project.created","project.archived")
iseval = 0

[aigov_key_actions]
definition = aigov_action IN ("api_key.created","api_key.updated","api_key.deleted","service_account.created","org_api_key_created","org_api_key_deleted")
iseval = 0

[aigov_export_actions]
definition = aigov_action IN ("org_data_export_started","org_data_export_completed","certificates.downloaded","file_uploaded","file_downloaded")
iseval = 0

[aigov_selfhosted]
definition = `aigov_index` sourcetype IN ("aigov:selfhosted:model","aigov:selfhosted:audit","aigov:selfhosted:metric","aigov:selfhosted:runtime","aigov:selfhosted:health")
iseval = 0
