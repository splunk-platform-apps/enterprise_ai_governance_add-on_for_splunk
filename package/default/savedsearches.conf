# Governance and security alerts. All alerts ship disabled; enable and
# tune the ones relevant to your organization.

[AI Governance - API Key Created or Deleted]
search = `aigov_audit` `aigov_key_actions` | table _time aigov_provider aigov_action aigov_user aigov_src_ip | sort - _time
description = An API key or service account was created, updated or deleted in a monitored AI platform.
disabled = 1
enableSched = 1
cron_schedule = */30 * * * *
dispatch.earliest_time = -35m
dispatch.latest_time = now
alert.suppress = 0
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than

