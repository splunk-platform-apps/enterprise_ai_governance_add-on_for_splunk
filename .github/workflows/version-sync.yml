name: Version Sync

# The org reusable workflows do not run a test step, and pre-commit only runs
# for contributors who have it installed, so the version-drift check needs its
# own gate here. Stdlib only - no dependencies to install.

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - CHANGELOG.md
      - globalConfig.json
      - package/app.manifest
      - package/default/app.conf
      - package/bin/ai_governance/__init__.py
      - tests/test_version_sync.py

# Allow only 1 concurrent execution
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-sync:
    name: Version locations agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          # Floor of the org build matrix, so 3.10+ syntax cannot creep in
          python-version: 3.9
      - run: python3 tests/test_version_sync.py
