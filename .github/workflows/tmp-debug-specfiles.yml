
# TEMPORARY debug workflow — delete before merging.
# Installs the built add-on into the same splunk/splunk:10.0.1 image the
# org install test uses and prints the raw btool / splunkd.log SpecFiles
# lines that the org gate reports only as opaque counts. btool check is
# offline, so the primary oracle needs no running splunkd.
name: tmp-debug-specfiles

on:
  push:
    branches:
      - release/v1.1.1

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build add-on
        run: |
          pip install -q splunk-add-on-ucc-framework==6.5.3
          ucc-gen build --source package --config globalConfig.json --ta-version 1.1.1

      - name: Start container and install add-on files
        run: |
          docker run -d --name spl \
            -e SPLUNK_START_ARGS='--accept-license' \
            -e SPLUNK_GENERAL_TERMS='--accept-sgt-current-at-splunk-com' \
            -e SPLUNK_PASSWORD='ChangeMe123!' \
            splunk/splunk:10.0.1  # pragma: allowlist secret
          sleep 20
          docker cp output/TA-ai-governance spl:/tmp/TA-ai-governance
          docker exec -u root spl bash -c 'cp -R /tmp/TA-ai-governance /opt/splunk/etc/apps/ && chown -R splunk:splunk /opt/splunk/etc/apps/TA-ai-governance'

      - name: ORACLE 1 — offline btool check inside 10.0.1
        run: |
          echo "=== btool complaints mentioning the add-on ==="
          docker exec -u splunk spl /opt/splunk/bin/splunk btool check --debug 2>&1 | grep -v '^Checking' | grep -B2 -A2 -i 'ai-governance' | head -60 || true
          echo "=== all btool non-Checking output (first 80 lines) ==="
          docker exec -u splunk spl /opt/splunk/bin/splunk btool check --debug 2>&1 | grep -v '^Checking' | head -80 || true

      - name: ORACLE 2 — true stop/start, then replay the gate search with _raw
        run: |
          for i in $(seq 1 45); do
            if docker exec -u splunk spl /opt/splunk/bin/splunk status 2>/dev/null | grep -q 'splunkd is running'; then
              echo "splunkd up after ~$((i*10))s"; break
            fi
            sleep 10
          done
          docker exec -u splunk spl /opt/splunk/bin/splunk stop || true
          for i in $(seq 1 12); do
            docker exec -u splunk spl /opt/splunk/bin/splunk status 2>/dev/null | grep -q 'not running' && { echo "stopped after ~$((i*5))s"; break; }
            sleep 5
          done
          docker exec -u splunk spl /opt/splunk/bin/splunk start --accept-license --answer-yes --no-prompt >/dev/null 2>&1 || true
          for i in $(seq 1 30); do
            if docker exec -u splunk spl /opt/splunk/bin/splunk status 2>/dev/null | grep -q 'splunkd is running'; then
              echo "restarted after ~$((i*10))s"; break
            fi
            sleep 10
          done
          echo "=== grep: app lines with WARN/ERROR in fresh splunkd.log ==="
          docker exec -u splunk spl bash -c "grep -E 'WARN|ERROR' /opt/splunk/var/log/splunk/splunkd.log | grep 'TA-ai-governance' | head -25" || true
          echo "=== grep: ALL app lines in fresh splunkd.log ==="
          docker exec -u splunk spl bash -c "grep -c 'TA-ai-governance' /opt/splunk/var/log/splunk/splunkd.log; grep 'TA-ai-governance' /opt/splunk/var/log/splunk/splunkd.log | head -25" || true
          echo "=== waiting 60s for _internal indexing, then replaying the org gate search with _raw ==="
          sleep 60
          docker exec spl bash -c "curl -sk -u admin:ChangeMe123! https://localhost:8089/services/search/jobs -d output_mode=json -d exec_mode=oneshot -d earliest_time=-24h -d latest_time=now --data-urlencode 'search=search index=_internal sourcetype=splunkd \"TA-ai-governance\" (ERROR OR WARN) | head 20 | table _time component log_level _raw'" | python3 -c "import json,sys; [print('---\n', r.get('_raw','(no _raw)')) for r in json.load(sys.stdin).get('results',[])]" || true
