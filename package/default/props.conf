# Sourcetype definitions for AI Governance Add-on for Splunk.
# All events are JSON written by modular inputs with explicit timestamps.
#
# Anthropic sourcetypes intentionally match the Anthropic Claude Enterprise
# Add-on (TA-anthropic_claude_enterprise): whether data is collected by this
# app or that one, it lands in the same sourcetypes and the aigov_* fields
# below are computed at search time.

###
### Anthropic (canonical anthropic:* sourcetypes)
###

[anthropic:compliance:activity]
TZ = UTC
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 999999
KV_MODE = json
TIME_PREFIX = "created_at"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 40
category = Security
description = Anthropic Claude Enterprise compliance activity feed events
EVAL-aigov_provider = coalesce(aigov_provider, "anthropic")
EVAL-aigov_product = coalesce(aigov_product, "Anthropic Claude Enterprise")
EVAL-aigov_category = coalesce(aigov_category, "audit")
EVAL-aigov_action = coalesce(aigov_action, event_type, type)
EVAL-aigov_user = coalesce(aigov_user, actor_email, entity_email, target_email)
EVAL-aigov_src_ip = coalesce(aigov_src_ip, actor_ip_address)

[anthropic:compliance:user]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
