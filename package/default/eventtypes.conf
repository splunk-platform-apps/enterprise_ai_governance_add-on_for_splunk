[aigov_audit_events]
search = sourcetype IN ("anthropic:compliance:activity","aigov:openai:audit","aigov:openai:compliance","aigov:gemini:audit","aigov:copilot:interaction","aigov:selfhosted:audit")
#description = Audit events from all AI providers

[aigov_authentication_events]
search = eventtype=aigov_audit_events aigov_action IN ("user_signed_in_sso","user_signed_in_google","user_signed_in_apple","user_signed_in_magic_link","user_signed_in_phone_code","login.succeeded","login.failed","user.login.succeeded","user.login.failed","LOGIN")
#description = Sign-in events across AI providers

[aigov_admin_change_events]
search = eventtype=aigov_audit_events aigov_action IN ("org_sso_toggled","org_sso_add_initiated","org_sso_connection_activated","org_sso_connection_deactivated","org_sso_connection_deleted","org_jit_toggled","org_domain_add_initiated","org_domain_verified","org_user_deleted","organization.updated","user.updated","role.updated","invite.sent","invite.accepted","invite.deleted","user.added","user.deleted","service_account.created","service_account.deleted","project.created","project.archived")
#description = Administrative changes across AI providers

[aigov_usage_events]
search = sourcetype IN ("anthropic:analytics:usage","anthropic:analytics:user_usage","anthropic:analytics:user_activity","aigov:openai:usage","aigov:copilot:usage")sourcetype IN ("anthropic:analytics:usage","anthropic:analytics:user_usage","anthropic:analytics:user_activity","aigov:openai:usage","aigov:copilot:usage")
#description = Usage metrics from all AI providers

[aigov_cost_events]
search = sourcetype IN ("anthropic:analytics:cost","anthropic:analytics:user_cost","aigov:openai:cost")
#description = Cost metrics from AI providers