[anthropic_compliance]
python.version = python3
interval = 300
index = default
backfill_days = 7
max_events_per_cycle = 2000
collect_directory = true

[anthropic_analytics]
python.version = python3
interval = 86400
index = default
lookback_days = 7
collect_usage = true
collect_cost = true
collect_summaries = true

[openai_compliance]
python.version = python3
interval = 300
index = default
event_types = AUTH_LOG
backfill_days = 7
max_files_per_cycle = 200
include_message_content = false

[openai_audit]
python.version = python3
interval = 300
index = default
backfill_days = 7
max_events_per_cycle = 2000
collect_users = true

[openai_usage]
python.version = python3
interval = 86400
index = default
lookback_days = 7
bucket_width = 1d
collect_usage = true
collect_costs = true

[gemini_audit]
python.version = python3
interval = 600
index = default
backfill_days = 7
max_events_per_cycle = 5000
applications = gemini_in_workspace_apps

[copilot_audit]
python.version = python3
interval = 900
index = default
backfill_days = 7
record_types = copilotInteraction

[copilot_usage]
python.version = python3
interval = 86400
index = default
period = D7

[selfhosted_monitor]
python.version = python3
interval = 300
index = default
collect_models = true
collect_metrics = true
metrics_path = /metrics
metrics_prefixes = vllm:,litellm_,ollama_
collect_runtime = true
